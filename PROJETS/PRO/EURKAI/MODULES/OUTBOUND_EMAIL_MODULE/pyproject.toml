[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "outbound-email-module"
version = "1.0.0"
description = "EURKAI — Generic reusable outbound email strategy engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["outbound_email_module*"]
