[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "eurkai-visual-assets"
version = "0.1.0"
description = "Générateur d'assets visuels EURKAI (DALL-E, Replicate, harmonisation couleurs)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.32.0",
    "pillow>=10.0.0",
]
