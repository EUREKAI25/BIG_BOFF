<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EURKAI — Design Tester</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#ctrl {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  background: #000; color: #fff; padding: 0 20px;
  display: flex; gap: 12px; align-items: center; height: 44px;
  font-family: monospace; font-size: 11px; border-bottom: 1px solid #333;
}
#ctrl button {
  background: #fff; color: #000; border: none; padding: 6px 18px;
  font-family: monospace; font-size: 12px; font-weight: 700;
  cursor: pointer; border-radius: 3px; white-space: nowrap; flex-shrink: 0;
}
#ctrl button:hover { background: #ddd; }
#brief { color: #888; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#brief b { color: #fff; }
#ctrl select {
  background: #111; color: #fff; border: 1px solid #444;
  padding: 4px 8px; font-family: monospace; font-size: 11px; border-radius: 3px;
}
#hint { color: #444; font-size: 10px; flex-shrink: 0; }
#page { margin-top: 44px; }
</style>
</head>
<body>

<div id="ctrl">
  <button onclick="generate()">↻ Générer</button>
  <div id="brief">Appuie sur R ou Espace pour générer un nouveau site...</div>
  <select id="arch" onchange="generate()">
    <option value="all">Tous</option>
    <option value="editorial">Editorial</option>
    <option value="playful">Playful</option>
    <option value="saas">SaaS</option>
  </select>
  <span id="hint">R / Espace = nouveau site</span>
</div>
<div id="page"></div>

<script>
// ── DATA POOLS ───────────────────────────────────────────────────────────────

  editorial: {

    keywords: ['culture','philosophie','art','pensée','regard','littérature','esthétique','mémoire','archive','trace','forme','sens','image','corps','temps'],
    values: ['rigueur','singularité','profondeur','contemplation','résistance','lenteur','précision','beauté','honnêteté'],
    audiences: ['les lecteurs exigeants','les curieux de culture',"les amateurs d'art",'celles et ceux qui pensent en lisant','un lectorat international','les chercheurs et créateurs'],

      { h:'Playfair Display', b:'Crimson Text', url:'https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap' },

      { h:'DM Serif Display', b:'DM Serif Text', url:'https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Serif+Text:ital@0;1&display=swap' },
    ],

    keywords: ['celebration','birthday','joy','memories','surprise','gift','party','love','confetti','magic','sparkle','happy','fun','cheer'],
    values: ['joy','simplicity','heart','fun','warmth','inclusivity','delight'],
    audiences: ['friends & family','birthday planners','people who love birthdays','anyone who wants to celebrate','hopeless romantics'],
    fonts: [
      { h:'Nunito', b:'Nunito', url:'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap' },
      { h:'Fredoka', b:'Poppins', url:'https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap' },
      { h:'Righteous', b:'DM Sans', url:'https://fonts.googleapis.com/css2?family=Righteous&family=DM+Sans:wght@400;500;700&display=swap' },
      { h:'Pacifico', b:'Nunito', url:'https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap' },
    ],
    palettes: [
      { p:'hsl(355,85%,55%)', s:'hsl(190,75%,45%)' },
      { p:'hsl(285,70%,55%)', s:'hsl(45,90%,55%)' },
      { p:'hsl(20,90%,55%)',  s:'hsl(200,80%,50%)' },
      { p:'hsl(160,70%,40%)',s:'hsl(330,80%,58%)' },

    keywords: ['automation','reliability','observability','deployment','security','scalability','performance','compliance','monitoring','orchestration','pipelines','drift'],
    values: ['precision','control','reliability','transparency','performance','simplicity','trust'],
    audiences: ['platform engineers','engineering teams','DevOps teams','SREs','infrastructure teams','serious teams','backend engineers'],
    fonts: [
      { h:'Inter', b:'Inter', url:'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap' },

      { h:'Space Grotesk', b:'Inter', url:'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap' },

    ],

      { p:'hsl(221,83%,53%)', s:'hsl(160,60%,42%)' },
      { p:'hsl(265,70%,55%)', s:'hsl(200,75%,50%)' },
      { p:'hsl(200,85%,48%)',s:'hsl(280,60%,55%)' },
      { p:'hsl(155,65%,40%)',s:'hsl(221,80%,50%)' },

// ── HELPERS ──────────────────────────────────────────────────────────────────

const pick  = a => a[Math.floor(Math.random() * a.length)]
const picks = (a,n) => [...a].sort(()=>Math.random()-.5).slice(0,n)
const cap   = s => s.charAt(0).toUpperCase() + s.slice(1)
const uid   = () => Math.random().toString(36).slice(2,7)
const img   = (seed,w,h,gray=false) => `https://picsum.photos/seed/${seed}/${w}/${h}${gray?'?grayscale':''}`

function makeCtx(arch) {
  const d = D[arch], pal = pick(d.palettes), font = pick(d.fonts)
  const kw = picks(d.keywords, 5), vals = picks(d.values, 3)
  const s = uid()
  return {
    arch, name: pick(d.names), industry: pick(d.industries),
    tagline: pick(d.taglines), audience: pick(d.audiences),
    keywords: kw, values: vals,
    hf: font.h, bf: font.b, gf: font.url,
    p: pal.p, s2: pal.s,
    img_hero:    img(s+'h',1400,700, arch==='editorial'),
    img_dash:    img(s+'d',1200,600),
    img_team:    img(s+'t',200,200,  arch!=='playful'),
    imgs:        [0,1,2,3,4,5].map(i=>img(s+i,400,280, arch==='editorial')),
    seed: s,
  }
}

// ── FONT LOADER ───────────────────────────────────────────────────────────────

let fontEl = null
function loadFont(url) {
  if (fontEl) fontEl.remove()
  fontEl = Object.assign(document.createElement('link'), { rel:'stylesheet', href:url })
  document.head.appendChild(fontEl)
}

// ── EDITORIAL ────────────────────────────────────────────────────────────────

function editorial(ctx) {
  const {p,s2:s,hf,bf,name,tagline,industry,audience,keywords:kw,values:vals,img_hero,imgs,seed} = ctx
  const nu = name.toUpperCase()
  const ind = (industry||'CULTURE & ARTS').toUpperCase()
  const cats = [...kw,'essai','critique','entretien'].map(k=>k.toUpperCase())
  const titles = [
    `Les formes du ${kw[0]||'doute'} dans la pensée contemporaine`,
    `Cartographies du ${kw[1]||'vide'} — cinq perspectives critiques`,
    `Relire ${name} en 2026 — ce qui reste`,
    `Ce que ${kw[2]||'le silence'} révèle encore`,
  ]
  const note = `Nous croyons à la ${vals[0]||'profondeur'}, à la ${vals[1]||'rigueur'}, et au pouvoir du ${kw[0]||'sens'}.`
  const quote = `Nous vivons dans une époque qui confond vitesse et intelligence, volume et profondeur. ${name} est une tentative de résistance — douce, mais déterminée.`

  const sidebar = [
    [cats[0]||'ESSAI', `La ${vals[0]||'lenteur'} comme acte politique`, 'M. Descamps · 14 min'],
    [cats[1]||'ART',   `Ce que ${kw[1]||'le silence'} révèle dans l'art`, 'A. Moreau · 9 min'],
    ['ENTRETIEN',      `Conversation sur ${kw[0]||'les arts'} et la vitesse`, 'S. Laurent · 18 min'],
  ].map(([cat,t,auth])=>`
    <div style="padding-bottom:22px;border-bottom:1px solid #1e1b18">
      <div style="font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:${p};margin-bottom:8px">${cat}</div>
      <p style="font-size:13px;color:#e2ddd4;line-height:1.45;margin-bottom:5px">${t}</p>
      <span style="font-size:10px;color:#4a4540">${auth}</span>
    </div>`).join('')

  const sommaire = titles.map((t,i)=>`
    <div style="display:grid;grid-template-columns:80px 1fr;gap:0;padding:24px ${i%2===1?'48px 24px 0':'0 48px 24px'};border-bottom:1px solid #1e1b18${i%2===0?';border-right:1px solid #1e1b18':''}">
      <div style="width:72px;height:52px;overflow:hidden">
        <img src="${imgs[i]}" style="width:100%;height:100%;object-fit:cover;filter:grayscale(100%) brightness(.65)" alt="">
      </div>
      <div style="padding-left:16px">
        <div style="font-size:8px;letter-spacing:.35em;text-transform:uppercase;color:${p};margin-bottom:7px">${cats[i%cats.length]}</div>
        <h3 style="font-family:'${hf}',Georgia,serif;font-size:.9rem;font-weight:400;color:#e2ddd4;line-height:1.4;margin-bottom:5px">${t}</h3>
        <span style="font-size:9px;color:#4a4540">${['D. Ricard · 22 min','L. Fassi · 16 min','T. Nora · 11 min','H. Leroux · 8 min'][i]}</span>
      </div>
    </div>`).join('')

  return `<div style="font-family:'${bf}',Georgia,serif;background:#0f0d0a;color:#e2ddd4;line-height:1.6;-webkit-font-smoothing:antialiased">
<nav style="position:sticky;top:44px;z-index:100;background:#0f0d0a;border-bottom:1px solid #1e1b18;height:52px;display:flex;align-items:center;padding:0 56px">
  <div style="width:100%;max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center">
    <span style="font-family:'${hf}',serif;font-size:1rem;font-weight:300;letter-spacing:.14em">${nu}</span>
    <div style="display:flex;gap:36px;align-items:center">
      ${kw.slice(0,3).map(k=>`<a style="font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#4a4540;cursor:pointer">${k}</a>`).join('')}
      <a style="font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#e2ddd4;border-bottom:1px solid ${p};padding-bottom:2px;cursor:pointer">S'abonner</a>
    </div>
  </div>
</nav>
<div style="background:#0a0806;border-bottom:1px solid #1e1b18;padding:14px 56px">
  <div style="max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:#4a4540">N°47 · PRINTEMPS 2026</span>
    <div style="display:flex;gap:20px">${kw.slice(0,3).map(k=>`<span style="font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:${p}">${k.toUpperCase()}</span>`).join('')}</div>
    <span style="font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:#4a4540">${ind}</span>
  </div>
</div>
<div style="height:440px;overflow:hidden;position:relative;border-bottom:1px solid #1e1b18">
  <img src="${img_hero}" alt="${name}" style="width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.15) brightness(.55)">
  <div style="position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(transparent,#0f0d0a)"></div>
  <div style="position:absolute;bottom:28px;left:56px">
    <div style="font-size:8px;letter-spacing:.38em;text-transform:uppercase;color:${p};margin-bottom:8px">${cats[0]} — UNE</div>
    <div style="font-family:'${hf}',serif;font-size:2rem;font-weight:300;color:#e8e4dc;max-width:580px;line-height:1.2">${titles[0]}</div>
  </div>
</div>
<section style="position:relative;overflow:hidden;border-bottom:1px solid #1e1b18;background:#0f0d0a">
  <div style="position:absolute;right:-20px;top:-60px;font-family:'${hf}',serif;font-size:340px;font-weight:200;line-height:1;color:rgba(255,255,255,.018);pointer-events:none;user-select:none;letter-spacing:-.04em">47</div>
  <div style="max-width:1120px;margin:0 auto;padding:72px 56px;display:grid;grid-template-columns:1fr 320px;gap:80px;align-items:start;position:relative">
    <div>
      <div style="font-size:8px;letter-spacing:.38em;text-transform:uppercase;color:${p};margin-bottom:22px">${cats[0]} — ARTICLE DE FOND</div>

      <div style="width:36px;height:1px;background:${p};margin-bottom:24px"></div>
      <p style="font-size:15px;color:#7a7368;line-height:1.95;max-width:520px;margin-bottom:40px">${note} Pour ${audience||'celles et ceux qui prennent le temps de penser'}.</p>
      <a style="font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#e2ddd4;border-bottom:1px solid #e2ddd4;padding-bottom:2px;cursor:pointer">LIRE L'ARTICLE →</a>
    </div>
    <div style="border-left:1px solid #1e1b18;padding-left:40px;display:flex;flex-direction:column;gap:22px">
      <div style="font-size:8px;letter-spacing:.38em;text-transform:uppercase;color:#4a4540;margin-bottom:4px">À LIRE AUSSI</div>

</section>
<section style="border-bottom:1px solid #1e1b18;background:#0c0a08">

</section>
<section style="background:#0a0807;border-bottom:1px solid #1e1b18">

    <div style="font-family:'${hf}',serif;font-size:8rem;font-weight:200;line-height:.65;color:${p};opacity:.45">"</div>
    <div>
      <p style="font-family:'${hf}',serif;font-size:2.1rem;font-weight:300;line-height:1.55;color:#e8e4dc;font-style:italic;margin-bottom:40px">${quote}</p>
      <div style="display:flex;align-items:center;gap:20px">
        <div style="width:28px;height:1px;background:${p}"></div>
        <span style="font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#4a4540">La rédaction · ${name}</span>
      </div>
    </div>
  </div>
</section>
<section style="border-bottom:1px solid #1e1b18;background:#0f0d0a">
  <div style="max-width:1120px;margin:0 auto;padding:72px 56px;display:grid;grid-template-columns:1fr 380px;gap:64px;align-items:center">
    <div>
      <div style="font-size:8px;letter-spacing:.38em;text-transform:uppercase;color:#4a4540;margin-bottom:22px">S'ABONNER</div>
      <h2 style="font-family:'${hf}',serif;font-size:2.8rem;font-weight:300;line-height:1.15;color:#e8e4dc;margin-bottom:18px">Quatre numéros par an.<br>Une pensée continue.</h2>
      <p style="font-size:13px;color:#7a7368;line-height:1.9">Recevez ${name} chez vous. Archives numériques incluses.</p>
    </div>
    <div style="border:1px solid #1e1b18;padding:36px;background:#0a0807">
      <div style="border-bottom:1px solid #1a1714;padding-bottom:24px;margin-bottom:24px">
        <div style="font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:#4a4540;margin-bottom:12px">Abonnement annuel</div>
        <div style="font-family:'${hf}',serif;font-size:3.5rem;font-weight:200;color:#e8e4dc;line-height:1">48 <span style="font-size:1rem;color:#4a4540">€/an</span></div>
      </div>
      <button style="width:100%;background:#e2ddd4;color:#0f0d0a;border:none;padding:15px;font-size:9px;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;font-weight:700">S'ABONNER</button>
    </div>

</section>
<footer style="background:#090705;padding:36px 56px">
  <div style="max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">

    <div style="display:flex;gap:28px">${kw.slice(0,3).map(k=>`<a style="font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#2e2a25;cursor:pointer">${k}</a>`).join('')}</div>
    <span style="font-size:8px;color:#1a1714">© 2026 ${name}</span>
  </div>

}

// ── PLAYFUL ──────────────────────────────────────────────────────────────────

function playful(ctx) {
  const {p,s2:s,hf,bf,name,tagline,audience,keywords:kw,values:vals,img_dash,imgs,seed} = ctx
  const heroH1 = tagline || `The most beautiful ${kw[0]||'celebration'} page they've ever seen`
  const heroSub = [audience?`For ${audience}.`:'', vals.length>=2?`Built around ${vals[0]} and ${vals[1]}.`:''].filter(Boolean).join(' ')

  const steps = [
    ['🎨', `Choose your ${kw[0]||'style'}`, `Dozens of themes inspired by ${kw[0]||'your vibe'}.`, p],
    ['📸', `Add your ${kw[1]||'magic'}`, 'Upload photos, write messages — make it yours.', s],
    ['🔗', 'Share the joy', 'One link. Send by text or WhatsApp. Watch them react.', '#16a34a'],
  ].map(([em,t,d,bg],i)=>`
    <div style="text-align:center">
      <div style="width:80px;height:80px;background:${bg};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;box-shadow:0 8px 24px ${bg}66">${em}</div>
      <div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:${bg};font-weight:800;margin-bottom:10px">STEP ${i+1}</div>
      <h3 style="font-family:'${hf}',sans-serif;font-size:1.1rem;font-weight:800;color:#111;margin-bottom:8px">${t}</h3>
      <p style="font-size:13px;color:#777;line-height:1.75;max-width:200px;margin:0 auto">${d}</p>
    </div>`).join('')

  const featureData = [
    ['🖼️', `${cap(kw[0]||'Photo')} gallery`,  `Showcase up to 50 ${kw[0]||'moments'} in a stunning layout.`],
    ['🎵', 'Music playlist',                    `Curate the perfect soundtrack for the ${kw[1]||'celebration'}.`],
    ['💌', 'Group messages',                    `Invite anyone to contribute ${kw[2]||'messages'} — secretly.`],
    ['🎊', `${cap(vals[0]||'Confetti')} effect`,'Because every celebration deserves spectacular chaos.'],
    ['⏳', 'Countdown timer',                   `Build suspense. Let the ${kw[3]||'excitement'} grow.`],
    ['📱', 'Mobile-first',                       'Looks stunning on any screen. No app, no friction.'],
  ]
  const rots = [-1,.5,1,-.5,.5,-1]
  const cols = [p,s,p,s,p,s]
  const features = featureData.map(([em,t,d],i)=>`
    <div style="background:#fff;border:2px solid ${cols[i]}40;border-radius:20px;padding:28px;transform:rotate(${rots[i]}deg)">

// ── MAIN ─────────────────────────────────────────────────────────────────────

function generate() {
  const filter = document.getElementById('arch').value
  const pool = filter === 'all' ? ['editorial','playful','saas'] : [filter]
  const arch = pick(pool)
  const ctx = makeCtx(arch)

  loadFont(ctx.gf)

  const html = arch === 'editorial' ? editorial(ctx)
             : arch === 'playful'   ? playful(ctx)
             :                        saas(ctx)

  document.getElementById('page').innerHTML = html
  document.getElementById('brief').innerHTML =
    `<b>${ctx.name}</b> · <span style="color:${ctx.p};font-weight:700">${arch}</span> · ${ctx.industry} · <b>${ctx.hf}</b> · ${ctx.keywords.slice(0,3).join(', ')} · <span style="color:#555">seed:${ctx.seed}</span>`
  document.getElementById('page').scrollIntoView({ behavior:'instant' })
}

document.addEventListener('keydown', e => {
  if (e.target !== document.body) return
  if (e.key === ' ') { e.preventDefault(); generate() }
  if (e.key === 'r' || e.key === 'R') generate()
})

generate()
</script>
